[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sk-zmq"
version = "0.3.0"
description = "Threaded ZeroMQ client for ordered, recoverable candle streams"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyzmq",
    "orjson",
]

[project.urls]
Repository = "https://github.com/sk-trade/sk-zmq"
Issues = "https://github.com/sk-trade/sk-zmq/issues"

[dependency-groups]
dev = [
    "build",
    "pyright>=1.1.414",
    "pytest",
    "pytest-cov",
    "ruff>=0.15.21",
]

[tool.setuptools]
packages = ["sk_zmq"]

[tool.setuptools.package-data]
sk_zmq = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["sk_zmq"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["sk_zmq"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
